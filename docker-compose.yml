version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/data/app.db
      - PDF_STORAGE_PATH=/app/uploads/pdfs
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - app_data:/app/data
      - app_pdfs:/app/uploads/pdfs
    restart: unless-stopped

volumes:
  app_data:
  app_pdfs:
